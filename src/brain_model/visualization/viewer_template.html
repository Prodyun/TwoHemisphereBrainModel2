<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-Hemisphere Brain Model</title>
<style>
  :root {
    --bg: #000;
    --text: #d6deea;
    --muted: #7d8899;
    --line: #1c222c;
    --activity: #38e1ff;
    --damage: #e0303f;
    --damage-low: #ffd84a;
    --help: #ffc03a;
    --send: #38c8ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 16px 4px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  main { position: relative; min-height: 0; }
  .layout { position: absolute; inset: 0; }
  #sep { display: grid; grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr); }
  .panel { position: relative; min-height: 0; overflow: hidden; height: 100%; }
  .panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none; }
  .panel canvas:active { cursor: grabbing; }
  .tag { position: absolute; top: 12px; left: 16px; pointer-events: none; }
  .tag b { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .tag span { color: var(--muted); font-size: 12px; }
  .tag .state { display: block; margin-top: 6px; font-variant-numeric: tabular-nums; color: var(--text); }
  .tag.right { left: auto; right: 16px; text-align: right; top: 48px; }
  .panel button.reset { position: absolute; top: 10px; right: 12px; }
  .bridge { position: relative; background: linear-gradient(90deg, transparent, rgba(255,192,58,0.05), transparent); }
  #link-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .bridge canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bridge .cap { position: absolute; bottom: 10px; width: 100%; text-align: center;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  footer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px 24px;
    padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .controls { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  button, select { background: #10141b; color: var(--text); border: 1px solid #2a3240;
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover, select:hover { border-color: #46526a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--activity); outline-offset: 2px; }
  .seg { display: inline-flex; border: 1px solid #2a3240; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button[aria-pressed="true"] { background: #1f2a3a; color: #fff; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--activity); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12px; align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend .ramp { width: 64px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: -1px; margin: 0 6px; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  .chart { position: relative; height: 150px; min-width: 0; }
  .chart canvas { width: 100%; height: 100%; display: block; }
  .hint { color: var(--muted); font-size: 12px; }
  .pick { min-height: 30px; }
  #pick-text b { color: #fff; }
  #pick-run { background: #3a1016; border-color: #8a2a35; }
  #pick-run:hover { border-color: #e0303f; }
  #tip { position: fixed; pointer-events: none; z-index: 5; background: rgba(8, 11, 16, 0.94);
    border: 1px solid #2a3240; border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.45;
    max-width: 260px; }
  #tip b { color: #fff; }
  #tip .m { color: var(--muted); }
  /* patient care: AI panel, therapy banner, helper legend */
  body.care .layout { right: 350px; }
  body.care.ai-closed .layout { right: 0; }
  body.booth.care .layout { right: 430px; }
  #ai { position: absolute; top: 10px; right: 10px; width: 330px; max-height: calc(100% - 20px); overflow: auto;
    background: rgba(8, 11, 16, 0.92); border: 1px solid #2a3240; border-radius: 8px; padding: 10px 12px; z-index: 4;
    font-size: 12.5px; }
  #ai h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #ffc03a; }
  #ai h3 { margin: 10px 0 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #ai .big { font-size: 26px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  #ai .bar { height: 7px; background: #1c222c; border-radius: 4px; overflow: hidden; margin: 2px 0 5px; }
  #ai .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2a78d6, #38e1ff); }
  #ai .mode { display: grid; grid-template-columns: 96px 1fr 44px; gap: 6px; align-items: center; }
  #ai ul { margin: 2px 0; padding-left: 16px; } #ai li { margin: 2px 0; }
  #ai .ctl { display: grid; grid-template-columns: 74px 1fr; gap: 6px 8px; align-items: center; margin-top: 6px; }
  #ai .ctl input[type=range] { min-width: 0; }
  #ai .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #ai .go { background: #10351f; border-color: #2f8a4f; }
  #ai .verify { margin-top: 8px; padding: 6px 8px; border: 1px dashed #2a3240; border-radius: 6px; }
  #ai .ok { color: #5fe08a; } #ai .bad { color: #ff7a7a; } #ai .m { color: var(--muted); }
  #ai-toggle { position: absolute; top: 10px; right: 10px; z-index: 5; }
  #banner { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 3; pointer-events: none;
    background: rgba(8, 11, 16, 0.88); border: 1px solid #2a3240; border-radius: 8px; padding: 6px 12px;
    font-size: 13px; text-align: center; max-width: 92%; }
  #banner b { color: #fff; } #banner .p { color: #38e1ff; } #banner .n { color: #b48cff; }
  #banner .z { color: #ffd84a; } #banner .v { color: #5fe08a; } #banner .m { color: var(--muted); }
  body.booth { font-size: 17px; } body.booth #ai { width: 420px; font-size: 15px; } body.booth #banner { font-size: 17px; }
  @media (max-width: 760px) {
    body { height: auto; }
    main { height: 120vh; }
    #sep { grid-template-columns: 1fr; grid-template-rows: 1fr 44px 1fr; }
    .bridge .cap { bottom: 2px; }
    footer { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Two-Hemisphere Brain Model</h1>
  <div class="seg" role="group" aria-label="View">
    <button data-view="separate" aria-pressed="true">Separate</button>
    <button data-view="together" aria-pressed="false">Together</button>
  </div>
  <span class="sub" id="subtitle"></span>
  <span class="hint">Drag to rotate · scroll to zoom · point at an area to see its name</span>
</header>

<main>
  <div class="layout" id="sep">
    <section class="panel" id="panel-left" aria-label="Left hemisphere 3D view">
      <div class="tag"><b>Left hemisphere</b><span id="spec-left"></span><span class="state" id="state-left"></span></div>
      <button class="reset" data-reset="left">Reset view</button>
    </section>
    <div class="bridge" aria-hidden="true"><canvas id="bridge"></canvas><div class="cap" id="bridge-cap">Corpus callosum</div></div>
    <canvas id="link-overlay" aria-hidden="true"></canvas>
    <section class="panel" id="panel-right" aria-label="Right hemisphere 3D view">
      <div class="tag"><b>Right hemisphere</b><span id="spec-right"></span><span class="state" id="state-right"></span></div>
      <button class="reset" data-reset="right">Reset view</button>
    </section>
  </div>
  <div class="layout" id="tog" hidden>
    <section class="panel" id="panel-together" aria-label="Both hemispheres with the corpus callosum">
      <div class="tag"><b>Both hemispheres</b><span id="tog-cap"></span>
        <span class="state" id="tstate-left"></span><span class="state" id="tstate-right"></span></div>
      <button class="reset" data-reset="together">Reset view</button>
    </section>
  </div>
  <div id="banner" hidden></div>
  <button id="ai-toggle" hidden>AI panel</button>
  <aside id="ai" hidden aria-label="AI Help Predictor"></aside>
</main>

<footer>
  <div class="controls">
    <div class="row">
      <button id="play" aria-label="Pause">Pause</button>
      <input type="range" id="slider" min="0" value="0" aria-label="Time step">
      <span class="time" id="time"></span>
      <select id="speed" aria-label="Playback speed">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option>
      </select>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Condition" id="cond-seg"></div>
      <label class="chk">Colour by
        <select id="color-by" aria-label="Colour by">
          <option value="damage" selected>Damage</option>
          <option value="input">Input from other side</option>
          <option value="activity">Activity</option>
          <option value="help">Help arriving (patient care)</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="show-outlines" checked> Area outlines</label>
      <label class="chk"><input type="checkbox" id="show-network"> Network view (180 areas + wiring)</label>
      <label class="chk"><input type="checkbox" id="show-functions"> Show functions</label>
    </div>
    <div class="row pick" id="pick">
      <span id="pick-text" class="hint"></span>
      <span id="pick-controls" hidden>
        <span class="seg" role="group" aria-label="Kind of disorder">
          <button data-kind="spreading" aria-pressed="true">Spreading</button>
          <button data-kind="stroke" aria-pressed="false">Stroke</button>
        </span>
        <button id="pick-run">Start disorder here</button>
      </span>
      <span id="pick-status" class="hint"></span>
    </div>
    <div class="legend" id="func-legend" hidden></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="chart"><canvas id="chart" aria-label="Function score chart"></canvas></div>
</footer>
<div id="tip" hidden></div>

<script id="brain-data" type="application/json">__BRAIN_DATA__</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = JSON.parse(document.getElementById('brain-data').textContent);
let M = D.meta;
const N = M.n_frames, SC = M.scale;
let damaged = M.damaged, healthySide = damaged === 'left' ? 'right' : 'left';
const SIDES = ['left', 'right'];
const FRIENDLY = { '44': "Broca's area", '45': "Broca's area", '55b': 'speech area 55b', 'V1': 'primary visual',
  '4': 'primary motor', 'FFC': 'fusiform face complex', 'FEF': 'frontal eye field', 'MT': 'motion area MT' };
const PICK = { sel: null, type: 'spreading', busy: false };   // the area chosen as the next start
const JUDGE = { targets: [], picking: false, mode: 'physical' };   // the judge's own plan
let PRED = null;                                                     // the AI's latest answer
const COND_LABEL = { connected: 'Connected brain', split: 'Split brain (callosum cut)' };
const condKeys = () => (M.care && M.care.order) || Object.keys(D.conditions);
const condLabel = k => (D.conditions[k] && D.conditions[k].label) || COND_LABEL[k] || k;
const condCut = k => { const c = D.conditions[k]; return (c && c.strength != null) ? c.strength === 0 : (k === 'split' || M.strength === 0); };
const state = { cond: condKeys()[0], frame: 0, playing: true, speed: 1, colorBy: 'damage', outlines: true,
  network: false, showFunctions: false, view: 'separate', acc: 0 };

const areaName = (side, r) => {
  const names = D.mesh[side].names;
  if (!names) return `region ${r + 1}`;
  return names[r].replace(/^[LR]_/, '').replace(/_ROI$/, '');
};
const nice = (side, r) => { const a = areaName(side, r); return FRIENDLY[a] ? `${a} (${FRIENDLY[a]})` : a; };

document.getElementById('spec-left').textContent = D.specialization.left;
document.getElementById('spec-right').textContent = D.specialization.right;
function setCaptions() {
  if (M.care) {
    const P = M.care.patient || {};
    document.getElementById('subtitle').textContent =
      `Patient: ${P.name || ''} · damage centred on ${P.epicentre || ''} (${damaged} hemisphere) · the ${healthySide} side helps · job trained: ${M.care.job.replace(/_/g, ' ')}`;
    document.getElementById('tog-cap').textContent = `gold arcs = help pathways from the AI · pulses = signals crossing the corpus callosum`;
    return;
  }
  document.getElementById('subtitle').textContent = M.lesion_type === 'stroke'
    ? `A stroke hits ${nice(damaged, M.lesion_center)} (${damaged} hemisphere) at step ${M.start_step}; the ${healthySide} side can help`
    : `A disorder starts in ${nice(damaged, M.lesion_center)} (${damaged} hemisphere) at step ${M.start_step} and spreads; the ${healthySide} side can help`;
  document.getElementById('tog-cap').textContent =
    `${D.callosal_links.length} strongest callosal fibres (${M.wiring} wiring) · gold = signals into the ${damaged} side`;
}
setCaptions();

// when the disease first reaches each area (damage above 10%), per condition and side, for the arrival flash
let ARRIVAL = {};
function computeArrival() {
  ARRIVAL = {};
  for (const [cname, c] of Object.entries(D.conditions)) {
    ARRIVAL[cname] = {};
    for (const side of SIDES) {
      const a = new Array(c[side + '_damage'][0].length).fill(Infinity);
      c[side + '_damage'].forEach((row, f) => row.forEach((d, r) => { if (d > 0.1 * SC && a[r] === Infinity) a[r] = f; }));
      ARRIVAL[cname][side] = a;
    }
  }
}
computeArrival();

// ---------- colours ----------
const FUNC_COLORS = [[0.95, 0.55, 0.20], [0.55, 0.85, 0.35], [0.75, 0.45, 0.95], [0.35, 0.70, 0.95],
  [0.95, 0.85, 0.35], [0.95, 0.45, 0.65], [0.40, 0.90, 0.80], [0.85, 0.65, 0.45]];
const FUNC_ORDER = [...new Set([...D.functions.left.names, ...D.functions.right.names])];
const FUNC_COLOR = Object.fromEntries(SIDES.map(s => [s,
  D.functions[s].names.map(n => FUNC_COLORS[FUNC_ORDER.indexOf(n) % FUNC_COLORS.length])]));
const DAMAGE_STOPS = [[0, [1.0, 0.85, 0.29]], [0.35, [0.93, 0.33, 0.12]], [0.7, [0.80, 0.07, 0.10]], [1, [0.36, 0.02, 0.05]]];
function damageColor(d) {               // linear: yellow (just reached) -> red -> dark red (destroyed)
  for (let i = 1; i < DAMAGE_STOPS.length; i++) {
    const [t1, c1] = DAMAGE_STOPS[i], [t0, c0] = DAMAGE_STOPS[i - 1];
    if (d <= t1) { const u = (d - t0) / (t1 - t0); return c0.map((x, k) => x + (c1[k] - x) * u); }
  }
  return DAMAGE_STOPS[DAMAGE_STOPS.length - 1][1];
}
const clamp01 = x => Math.max(0, Math.min(1, x));

// colour of every area (one RGB triple per area) for the current frame and colour mode
function regionColors(side, f) {
  const c = D.conditions[state.cond];
  const act = c[side][f], dmg = c[side + '_damage'][f], into = c['into_' + side][f], out = c['out_' + side][f];
  const arrival = ARRIVAL[state.cond][side], funcOf = D.functions[side].region;
  const n = dmg.length, rgb = new Float32Array(3 * n);
  for (let r = 0; r < n; r++) {
    const d = dmg[r] / SC;
    let R, G, B;
    if (state.colorBy === 'damage') {
      [R, G, B] = d < 0.02 ? [0.34, 0.36, 0.40] : damageColor(d);
      const since = f - arrival[r];
      if (since >= 0 && since < 8) { const k = 0.75 * (1 - since / 8); R += (1 - R) * k; G += (1 - G) * k; B += (0.9 - B) * k; }
    } else if (state.colorBy === 'input' || state.colorBy === 'help') {
      const g = clamp01(into[r] / M.max_into), s = clamp01(out[r] / M.max_out);
      R = 0.10 + 0.95 * g + 0.10 * s; G = 0.11 + 0.70 * g + 0.55 * s; B = 0.14 + 0.10 * g + 0.75 * s;
    } else {
      const a = act[r] / SC, pos = Math.max(a, 0), neg = Math.max(-a, 0);
      R = 0.07 + 0.12 * pos + 0.10 * neg; G = 0.09 + 0.80 * pos + 0.03 * neg; B = 0.16 + 0.85 * pos + 0.30 * neg;
    }
    if (state.colorBy !== 'damage' && d >= 0.02) {     // other modes: damaged areas dim, with a red tint
      const k = 0.65 * d; R = R * (1 - k) + 0.45 * k; G *= 1 - k; B *= 1 - k;
    }
    if (state.showFunctions && funcOf[r] >= 0) {
      const fc = FUNC_COLOR[side][funcOf[r]];
      R = 0.45 * R + 0.55 * fc[0]; G = 0.45 * G + 0.55 * fc[1]; B = 0.45 * B + 0.55 * fc[2];
    }
    rgb[3 * r] = R; rgb[3 * r + 1] = G; rgb[3 * r + 2] = B;
  }
  return rgb;
}

// ---------- one hemisphere model (used in both views) ----------
function bezier(a, b, lift, segs) {     // curve from a to b, bulging outward by `lift`
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const ctrl = mid.clone().add(lift);
  const pts = [];
  for (let s = 0; s <= segs; s++) {
    const t = s / segs, u = 1 - t;
    pts.push(new THREE.Vector3(
      u * u * a.x + 2 * u * t * ctrl.x + t * t * b.x,
      u * u * a.y + 2 * u * t * ctrl.y + t * t * b.y,
      u * u * a.z + 2 * u * t * ctrl.z + t * t * b.z));
  }
  return pts;
}
function textSprite(text, color = '#ff6b78') {
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  ctx.font = '600 44px system-ui, sans-serif';
  cv.width = Math.ceil(ctx.measureText(text).width) + 28; cv.height = 64;
  ctx.font = '600 44px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, 14, 33);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
  sp.scale.set(0.0011 * cv.width, 0.0011 * cv.height, 1);
  sp.renderOrder = 10;
  return sp;
}

const HEMIS = [];   // every hemisphere model in every view, all repainted together
function makeHemi(side, together) {
  const m = D.mesh[side];
  const group = new THREE.Group();
  if (together) group.position.set(m.offset[0] + (side === 'left' ? -0.02 : 0.02), m.offset[1], m.offset[2]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(m.v, 3));
  geo.setIndex(m.f);
  geo.computeVertexNormals();
  const colors = new Float32Array(m.v.length);
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const surfaceMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, metalness: 0, transparent: true });
  const surface = new THREE.Mesh(geo, surfaceMat);
  group.add(surface);

  // the 180 areas as nodes (one small sphere each)
  const centers = m.centers.map(c => new THREE.Vector3(...c));
  const nodes = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial(), centers.length);
  nodes.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(3 * centers.length), 3);
  group.add(nodes);

  // the strongest real connections between areas, as arcs (lit up when disease travels along them)
  const SEG = 10, linkPts = [];
  for (const [i, j] of m.links) {
    const a = centers[i], b = centers[j];
    const lift = a.clone().add(b).multiplyScalar(0.5).normalize().multiplyScalar(0.08 + 0.25 * a.distanceTo(b));
    const p = bezier(a, b, lift, SEG);
    for (let s = 0; s < SEG; s++) linkPts.push(p[s], p[s + 1]);
  }
  const linkGeo = new THREE.BufferGeometry().setFromPoints(linkPts);
  const linkColors = new Float32Array(3 * linkPts.length);
  linkGeo.setAttribute('color', new THREE.BufferAttribute(linkColors, 3));
  const links = new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  group.add(links);

  // start marker (every hemisphere has one; only the damaged side's is shown) and selection marker
  const marker = new THREE.Group();
  marker.add(new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff4455 })));
  group.add(marker);
  const selMarker = new THREE.Mesh(new THREE.SphereGeometry(0.026, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false }));
  selMarker.renderOrder = 9; selMarker.visible = false;
  group.add(selMarker);
  const helperGroup = new THREE.Group(); group.add(helperGroup);
  const borderSet = m.border ? new Uint8Array(m.vr.length / m.k) : null;
  if (borderSet) for (const v of m.border) borderSet[v] = 1;
  const h = { side, m, group, geo, colors, surface, nodes, centers, links, linkColors, SEG, marker, selMarker, borderSet,
    helperGroup, together };
  placeMarker(h); placeHelpers(h);
  HEMIS.push(h);
  return h;
}
// AI helper areas (gold, size = share of the help) and the judge's chosen targets (white)
function placeHelpers(h) {

for (const view of Object.values(VIEWS)) {

    bctx.strokeStyle = '#e0303f'; bctx.setLineDash([6, 6]); bctx.lineWidth = 1.5; bctx.beginPath();
    if (vertical) { bctx.moveTo(w / 2, 16); bctx.lineTo(w / 2, h - 28); } else { bctx.moveTo(16, h / 2); bctx.lineTo(w - 16, h / 2); }
    bctx.stroke(); bctx.setLineDash([]); cap.textContent = 'Callosum cut'; return;
  }
  cap.textContent = 'Corpus callosum';
  const help = helpAmount(D.conditions[state.cond], f) / maxHelp, toward = damaged === 'left' ? -1 : 1;
  for (const p of particles) {
    const isHelp = p.dir === toward, speed = isHelp ? 0.35 + 0.9 * help : 0.35;
    p.t += dt * speed * state.speed * (state.playing ? 1 : 0.15);
    if (p.t > 1) { p.t -= 1; p.y = Math.random(); }
    const along = p.dir > 0 ? p.t : 1 - p.t, x = along * len, y = 16 + p.y * (span - 44), a = Math.sin(Math.PI * p.t);
    bctx.fillStyle = isHelp ? `rgba(255,192,58,${(0.25 + 0.75 * help) * a})` : `rgba(56,225,255,${0.35 * a})`;
    const r = isHelp ? 1.4 + 1.8 * help : 1.3;
    bctx.beginPath(); if (vertical) bctx.arc(x, y, r, 0, 6.283); else bctx.arc(y, x, r, 0, 6.283); bctx.fill();
  }
}

// ---------- chart: function of the damaged hemisphere, connected vs split ----------
const chart = document.getElementById('chart'), cctx = chart.getContext('2d');
function drawChart(f) {
  const w = chart.clientWidth, h = chart.clientHeight, dpr = Math.min(devicePixelRatio, 2);
  if (!w || !h) return;
  if (chart.width !== Math.round(w * dpr) || chart.height !== Math.round(h * dpr)) { chart.width = Math.round(w * dpr); chart.height = Math.round(h * dpr); }
  const ctx = cctx; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const L = 40, R = 12, T = 22, B = 20, pw = w - L - R, ph = h - T - B, ymax = 1.2;
  const X = i => L + (i / (N - 1)) * pw, Y = v => T + ph - (Math.min(v, ymax) / ymax) * ph;
  ctx.font = '11px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  for (const v of [0, 0.5, 1]) {
    ctx.strokeStyle = '#1c222c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + pw, Y(v)); ctx.stroke();
    ctx.fillStyle = '#7d8899'; ctx.textAlign = 'right'; ctx.fillText(Math.round(v * 100) + '%', L - 6, Y(v));
  }
  const c = D.conditions[state.cond];
  ctx.fillStyle = 'rgba(224,48,63,0.18)'; ctx.beginPath(); ctx.moveTo(X(0), Y(0));
  for (let i = 0; i < N; i++) ctx.lineTo(X(i), Y(mean(c[damaged + '_damage'][i]) / SC));
  ctx.lineTo(X(N - 1), Y(0)); ctx.closePath(); ctx.fill();
  if (M.care) { drawCareChart(ctx, w, h, L, R, T, B, pw, ph, X, Y, f); return; }
  for (const [name, color] of [['split', '#8a93a3'], ['connected', '#38e1ff']]) {
    if (!D.conditions[name]) continue;
    const s = D.conditions[name]['score_' + damaged];
    ctx.strokeStyle = color; ctx.lineWidth = name === state.cond ? 2.2 : 1.2; ctx.globalAlpha = name === state.cond ? 1 : 0.55;
    ctx.beginPath(); let started = false;
    for (let i = 0; i < N; i++) { if (s[i] == null) continue; started ? ctx.lineTo(X(i), Y(s[i])) : ctx.moveTo(X(i), Y(s[i])); started = true; }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(f), T); ctx.lineTo(X(f), T + ph); ctx.stroke();
  ctx.textAlign = 'left'; ctx.fillStyle = '#d6deea';
  ctx.fillText(`${damaged[0].toUpperCase() + damaged.slice(1)} hemisphere function (vs. healthy)`, L, 9);
  let kx = L + pw; ctx.textAlign = 'right';
  for (const [label, color] of [['Damage', 'rgba(224,48,63,0.6)'], ['Split brain', '#8a93a3'], ['Connected', '#38e1ff']]) {
    ctx.fillStyle = '#7d8899'; ctx.fillText(label, kx, 9); const tw = ctx.measureText(label).width;
    ctx.fillStyle = color; ctx.fillRect(kx - tw - 14, 5, 9, 9); kx -= tw + 28;
  }
  ctx.fillStyle = '#7d8899'; ctx.textAlign = 'left'; ctx.fillText('time →', L, h - 8);
}
const CARE_COLORS = { recommended: '#38e1ff', judge: '#ffffff', standard_care: '#ffc03a', split: '#8a93a3' };
function drawCareChart(ctx, w, h, L, R, T, B, pw, ph, X, Y, f) {
  const C = M.care, wk = C.week_steps / M.stride, on = C.onset / M.stride;
  ctx.setLineDash([4, 4]); ctx.strokeStyle = '#5fe08a'; ctx.beginPath(); ctx.moveTo(L, Y(C.goal)); ctx.lineTo(L + pw, Y(C.goal)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#5fe08a'; ctx.textAlign = 'left'; ctx.fillText(`goal ${Math.round(C.goal * 100)}%`, L + 4, Y(C.goal) - 7);
  for (const k of condKeys()) {
    const ys = D.conditions[k].weekly || [];
    ctx.strokeStyle = CARE_COLORS[k] || '#b48cff'; ctx.lineWidth = k === state.cond ? 2.4 : 1.3; ctx.globalAlpha = k === state.cond ? 1 : 0.6;
    ctx.beginPath();
    ys.forEach((v, i) => { const x = X(Math.min(N - 1, on + (i + 1) * wk)); i ? ctx.lineTo(x, Y(v)) : ctx.moveTo(x, Y(v)); });
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(f), T); ctx.lineTo(X(f), T + ph); ctx.stroke();
  ctx.textAlign = 'left'; ctx.fillStyle = '#d6deea';
  ctx.fillText(`Trained job (${C.job.replace(/_/g, ' ')}), % of healthy, week by week`, L, 9);
  let kx = L + pw; ctx.textAlign = 'right';
  for (const k of [...condKeys()].reverse()) {
    const label = condLabel(k).split(':')[0];
    ctx.fillStyle = '#7d8899'; ctx.fillText(label, kx, 9); const tw = ctx.measureText(label).width;
    ctx.fillStyle = CARE_COLORS[k] || '#b48cff'; ctx.fillRect(kx - tw - 14, 5, 9, 9); kx -= tw + 28;
  }
  ctx.fillStyle = '#7d8899'; ctx.textAlign = 'left'; ctx.fillText('weeks after the injury →', L, h - 8);
}
chart.addEventListener('pointerdown', e => {
  const r = chart.getBoundingClientRect(), pw = r.width - 52;
  setFrame(Math.round(clamp01((e.clientX - r.left - 40) / pw) * (N - 1)));
});

// ---------- controls ----------
const slider = document.getElementById('slider'); slider.max = N - 1;
function setFrame(f) { state.frame = f; state.acc = 0; redraw(); }
function redraw() {
  const f = state.frame, c = D.conditions[state.cond];
  for (const side of SIDES) {
    const rgb = regionColors(side, f), dmg = c[side + '_damage'][f];
    for (const h of HEMIS) if (h.side === side) paintHemi(h, f, rgb, dmg);
  }
  paintCallosum(f);
  updateText(f); drawChart(f);
}
slider.oninput = () => setFrame(+slider.value);
const playBtn = document.getElementById('play');
const setPlaying = on => { state.playing = on; playBtn.textContent = on ? 'Pause' : 'Play'; playBtn.setAttribute('aria-label', playBtn.textContent); };
playBtn.onclick = () => { if (!state.playing && state.frame >= N - 1) setFrame(0); setPlaying(!state.playing); };
document.getElementById('speed').onchange = e => state.speed = +e.target.value;
document.getElementById('color-by').onchange = e => { state.colorBy = e.target.value; updateLegend(); redraw(); };
document.getElementById('show-outlines').onchange = e => { state.outlines = e.target.checked; redraw(); };
document.getElementById('show-network').onchange = e => { state.network = e.target.checked; redraw(); };
(() => {
  const legend = document.getElementById('func-legend');
  for (const [i, name] of FUNC_ORDER.entries()) {
    const sides = SIDES.filter(s => D.functions[s].names.includes(name)).map(s => s[0].toUpperCase());
    const [r, g, b] = FUNC_COLORS[i % FUNC_COLORS.length].map(x => Math.round(x * 255));
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:rgb(${r},${g},${b})"></i>`;
    s.append(`${name.replace(/_/g, ' ')} (${sides.join('+')})`);
    legend.append(s);
  }
  document.getElementById('show-functions').onchange = e => { state.showFunctions = e.target.checked; legend.hidden = !e.target.checked; redraw(); };
})();
function buildCondButtons() {
  const seg = document.getElementById('cond-seg'); seg.innerHTML = '';
  if (!condKeys().includes(state.cond)) state.cond = condKeys()[0];
  for (const k of condKeys()) {
    const b = document.createElement('button'); b.dataset.cond = k; b.textContent = condLabel(k).split(' (')[0].replace(/^AI plan:.*/, 'AI plan');
    b.title = condLabel(k); b.setAttribute('aria-pressed', k === state.cond);
    b.onclick = () => { state.cond = k; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); redraw(); };
    seg.append(b);
  }
}
buildCondButtons();
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.getElementById('sep').hidden = state.view !== 'separate';
  document.getElementById('tog').hidden = state.view !== 'together';
  for (const v of Object.values(VIEWS)) v.resize();   // a view that started hidden has size 0 until resized
  updateLegend();
});
addEventListener('keydown', e => { if (e.code === 'Space' && !['BUTTON', 'SELECT', 'INPUT'].includes(e.target.tagName)) { e.preventDefault(); playBtn.click(); } });
new ResizeObserver(() => drawChart(state.frame)).observe(chart);

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Number.isFinite(dt) && dt > 0 ? Math.min(0.1, dt) : 1 / 60;   // guard against odd timer values
  if (state.playing) {
    state.acc += dt * 15 * state.speed;             // ~15 frames per second at 1x
    if (state.acc >= 1) {
      const next = Math.min(N - 1, state.frame + Math.floor(state.acc));
      state.acc %= 1; state.frame = next; redraw();
      if (next >= N - 1) setPlaying(false);
    }
  }
  const shown = state.view === 'together' ? ['together'] : SIDES;
  if (state.view === 'together') { movePulses(dt); moveComets(dt); }
  for (const name of shown) { const v = VIEWS[name]; v.controls.update(); v.renderer.render(v.scene, v.camera); }
  if (state.view === 'separate') { drawBridge(state.frame, dt); drawOverlay(dt); }
  requestAnimationFrame(loop);
}
// Optional link settings (handy for screenshots), e.g.
//   viewer.html#frame=150&cond=split&paused&view=together&color=input&network&functions
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.has('frame')) state.frame = Math.max(0, Math.min(N - 1, +hash.get('frame') || 0));
if (hash.has('cond')) document.querySelector(`[data-cond="${hash.get('cond')}"]`)?.click();
if (hash.has('paused')) setPlaying(false);
if (hash.get('view') === 'together') document.querySelector('[data-view="together"]').click();
if (hash.has('color')) { const s = document.getElementById('color-by'); s.value = hash.get('color'); s.onchange({ target: s }); }
if (hash.has('network')) { const cb = document.getElementById('show-network'); cb.checked = true; cb.onchange({ target: cb }); }
if (hash.has('functions')) { const cb = document.getElementById('show-functions'); cb.checked = true; cb.onchange({ target: cb }); }
if (hash.has('booth')) document.body.classList.add('booth');
if (hash.has('seek') && M.care) {      // e.g. #seek=practice&day=50 jumps to a practice session after day 50
  const c = D.conditions[state.cond], from = Math.ceil((M.care.onset + (+hash.get('day') || 0) * M.care.steps_per_day) / M.stride);
  const want = hash.get('seek') === 'night' ? 2 : 1;
  for (let i = from; i < N; i++) if (c.practice[i] === want && (want !== 1 || !c.mode.includes('bci') || c.bci_fired[i] > 0)) { state.frame = i; break; }
}
updateLegend();
redraw();
if (hash.has('paused')) movePulses(0.6);
// e.g. #pick=right:R_FFC&run  chooses an area (and starts it) without clicking (for testing/screenshots)
if (hash.has('pick')) {
  const [side, name] = hash.get('pick').split(':'), r = (D.mesh[side]?.names || []).indexOf(name);
  if (r >= 0) { selectArea(side, r); if (hash.has('run')) document.getElementById('pick-run').click(); }
}
requestAnimationFrame(loop);
</script>
