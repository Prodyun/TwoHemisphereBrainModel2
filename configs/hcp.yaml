# REAL-BRAIN experiment (Human Connectome Project data, via the ENIGMA Toolbox).
# Setup once:  python scripts/fetch_enigma_data.py  then  python scripts/prepare_hcp.py
# Run:         python scripts/run_simulation.py --config configs/hcp.yaml
#
# A disorder starts in Broca's area (left area 44, speech) and spreads. We compare a connected
# brain with a split brain to see how much the right hemisphere helps the left keep working.
seed: 42
steps: 960            # simulation time steps (8 scoring windows of 120 steps)
frame_stride: 4       # keep every 4th step for the 3D viewer

n_regions: 180        # Glasser (HCP-MMP1.0) areas per hemisphere; must be 180 for the real brain

anatomy:
  source: hcp                            # hcp = real brain; synthetic = the hand-made stand-in
  file: data/processed/hcp_brain.npz

# Shared settings (the same population equation in both hemispheres).
# Each hemisphere can override them under its own `dynamics:` (filled in by the fMRI fit).
dynamics:
  leak: 0.2           # how fast a region's activity relaxes (0..1 per step)
  gain: 0.5           # how strongly regions drive their neighbours (<1 keeps it stable)
  noise: 0.05         # random background activity
  stimulus: 0.6       # strength of the task input
  shared_task: 0.3    # each side also does a weaker copy of the other side's task at the matching areas

# Each function = the Glasser areas it uses + how its input changes over time.
# Area lists are chosen from the literature (see docs/architecture.md), not fitted to data.
# Per-hemisphere settings below were FITTED to real resting-state fMRI (HCP group connectivity; the 2
# pilot subjects were fitted too) with scripts/fit_to_fmri.py (results/fit_main). Note: on held-out noise,
# separate left/right settings fit the group no better than identical ones (0.254 vs 0.257) and the
# subjects only slightly better (A 0.181 vs 0.176, B 0.226 vs 0.213), so the settings are only loosely
# pinned down; what makes the hemispheres differ is mainly their real wiring and their jobs.
left_hemisphere:
  specialization: "language · math/sequences"
  dynamics: {leak: 0.258, gain: 0.886, noise: 0.093}
  functions:
    language:          # left-dominant: Broca's area (44, 45), Wernicke's region (STS, TPOJ1), 55b, SFL
      areas: [44, 45, 47l, IFSa, IFSp, 55b, SFL, PSL, STSda, STSdp, STSvp, TPOJ1, A5]
      pattern: sequence          # words of a sentence: a pulse moving front -> back through the network
    math_sequences:    # left-dominant: number areas along the intraparietal sulcus + premotor sequencing
      areas: [IP0, IP1, IP2, AIP, 7PC, 6a, 6r, 8C]
      pattern: ramp              # counting: input climbs step by step, then resets
    vision:            # shared: early visual areas, for the RIGHT half of what you see
      areas: [V1, V2, V3, V4]
      pattern: sine
      params: {period: 40, phase: 0.0}
    movement:          # shared: motor + touch areas, for the RIGHT hand
      areas: ["4", 3a, 3b, "1", "2", 6d, 6mp]
      pattern: sine
      params: {period: 50, phase: 0.0}

right_hemisphere:
  specialization: "spatial attention · faces · emotion in voice"
  dynamics: {leak: 0.328, gain: 0.698, noise: 0.010}
  functions:
    spatial_attention: # right-dominant: frontal eye field + parietal attention areas + motion areas
      areas: [FEF, PEF, LIPv, LIPd, VIP, 7AL, 7PL, IPS1, MT, MST, V3A, PGp]
      pattern: wave              # taking in a whole scene at once
    faces:             # right-dominant: fusiform face complex and neighbours
      areas: [FFC, PIT, VVC, V8, TE2p, STSvp]
      pattern: bursts            # a face appears, then disappears
    emotion_prosody:   # right-dominant: the right-side partners of the language areas carry the tone of voice
      areas: [44, 45, 47l, IFSa, 55b, PSL, STSda, STSdp, A5, TPOJ1, STGa]
      pattern: sine
      params: {period: 80, phase: 0.0}
    vision:            # shared: early visual areas, for the LEFT half of what you see
      areas: [V1, V2, V3, V4]
      pattern: sine
      params: {period: 40, phase: 1.5708}   # a different scene from the right side's
    movement:          # shared: motor + touch areas, for the LEFT hand
      areas: ["4", 3a, 3b, "1", "2", 6d, 6mp]
      pattern: sine
      params: {period: 70, phase: 0.0}      # the left hand moves on its own rhythm

corpus_callosum:
  wiring: real           # real = measured left-right fibres; mirror = area i <-> area i only; both
  strength: 0.381         # 0 = cut ("split brain"), 1 = strongest link (fitted to resting fMRI)
  plasticity_rate: 0.02  # how fast the brain adapts to damage (0 = no adaptation)
  plasticity_gain: 1.5   # how much stronger links into damaged areas can get (1.5 = +150%)
  takeover_gain: 3.0     # how much more of the damaged side's task the healthy side can take on

lesion:
  hemisphere: left       # left or right
  region: L_44           # where it starts: Broca's area
  type: spreading        # spreading (disease-like) or stroke (sudden, does not spread)
  model: fisher_kpp      # how it spreads: fisher_kpp = travels along the real wiring as a front
                         # (network Fisher-Kolmogorov, used for prion-like protein spread);
                         # simple = the earlier rule (uses spread_rate)
  start_step: 120        # when the disorder appears
  initial_damage: 0.6    # damage at the starting area (0 = healthy, 1 = destroyed)
  transport: 0.002       # how much damage moves along each fibre per step (shorter fibres carry more)
  growth: 0.0105         # how fast damage takes hold and grows inside an area once it arrives.
                         # These two give ~45% average damage by the end; direct neighbours of the
                         # start are reached around step 440, the next ring ~730, the next ~870
  spread_rate: 0.004     # only used by model: simple
  max_damage: 0.98       # damaged areas keep a little function
  cross_spread: 0.0      # damage that leaks to the other hemisphere through the callosum
  stroke_neighbors: 4            # stroke only: how many strongly linked neighbours are also hit
  stroke_neighbor_damage: 0.42   # stroke only: damage in those neighbours

analysis:
  window: 120            # steps per scoring window
